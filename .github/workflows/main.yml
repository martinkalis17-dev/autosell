name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Droit d'execution pour gradlew
        run: chmod +x gradlew

      - name: Compiler
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: autosell
          path: build/libs/*.jar
